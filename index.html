<body>

  <script type="text/babel">
    const Icon=({name})=>{const common={fill:"none",viewBox:"0 0 24 24",stroke:"currentColor",strokeWidth:1.8,strokeLinecap:"round",strokeLinejoin:"round","aria-hidden":true};const paths={project:<><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5"/></>,mail:<><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></>,location:<><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></>,arrow:<><path d="M5 12h14M14 7l5 5-5 5"/></>};return <svg {...common}>{paths[name]}</svg>};

    const EvidenceCard=({eyebrow,title,description,src,alt,points})=><article className="evidence-card"><header className="evidence-card-head"><span className="evidence-type">{eyebrow}</span><h3>{title}</h3><p>{description}</p></header><div className="evidence-media"><img src={src} alt={alt} loading="lazy"/></div><ul className="evidence-points">{points.map(point=><li key={point}>{point}</li>)}</ul></article>;
    const SupportCard=({src,title,description,alt})=><article className="support-card"><img src={src} alt={alt} loading="lazy"/><div className="support-copy"><h4>{title}</h4><p>{description}</p></div></article>;

      return <>
