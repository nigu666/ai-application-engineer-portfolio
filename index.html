<body>

  <script type="text/babel">
    const MEDIA = [
      {id:"workflow",group:"workflow",title:"Dify Workflow",src:"assets/01_Dify_Workflow_脱敏.png",alt:"智慧水产 AI 助手的 Dify 完整工作流，接口地址已脱敏",caption:"意图分类后进入不同业务分支；知识检索与设备工具调用各自展开。"},
      {id:"rag",group:"rag",title:"知识库与检索配置",src:"assets/02_Dify_RAG检索配置_脱敏.png",alt:"Dify 知识库的高质量索引、Embedding、混合检索与 Rerank 配置",caption:"领域资料经过分段与索引，通过混合检索和 Rerank 选择相关知识片段。"},
      {id:"api",group:"api",title:"设备状态查询",src:"assets/03_业务API_设备状态查询_脱敏.png",alt:"设备 H_P3_PU1 状态查询的实际 Dify 运行记录与回答",caption:"提取设备参数、映射设备 ID、调用已有业务接口，解析返回数据后组织回答。"},
      {id:"not-found",group:"api",title:"设备不存在的分支",src:"assets/03_API_NOT_FOUND_真实截图.png",alt:"查询不存在的 ABC 设备时，Dify 工作流进入 NOT_FOUND 分支",caption:"设备检索为空时进入 NOT_FOUND 分支，明确反馈未找到对应设备。"},
      {id:"water",group:"api",title:"业务数据与水质分析",src:"assets/03_水质分析_脱敏.png",alt:"读取水质业务数据后的分析回答，包含液位、pH 和缺失温度数据的提示",caption:"读取传感器返回数据后分析，并保留数据缺失时无法评估的提示。"},
      {id:"qa",group:"rag",title:"知识问答与引用",src:"assets/02_RAG_知识问答_真实截图.png",alt:"溶解氧知识问答的运行截图，回答保留领域知识库引用",caption:"根据检索上下文解释领域知识，并保留知识来源引用。"},
      {id:"mobile-home",group:"mobile",title:"移动端 AI 入口",src:"assets/mobile-ai-assistant/05_移动端AI落地全景.png",alt:"智慧水产移动端业务首页与 AI 助手入口",caption:"AI 入口融入水质监测、知识库和设备管理的移动端业务环境。"},
      {id:"mobile-chat",group:"mobile",title:"移动端对话界面",src:"assets/mobile-ai-assistant/02_AI对话页面.png",alt:"智慧水产移动端 AI 助手对话页面、消息输入和发送操作",caption:"移动端对话界面与消息交互；该画面不作为成功调用真实服务的证据。"},
      {id:"dashboard",group:"twin",title:"养殖监控数据驾驶舱",src:"assets/05_渔立方_Dashboard_真实项目.png",alt:"渔立方数字孪生养殖监控 Dashboard，展示水质、鱼情、设备状态与告警",caption:"水质、鱼情、设备与告警的页面信息层级和数据可视化原型。"},
      {id:"twin-scene",group:"twin",title:"数字孪生场景页面",src:"assets/05_渔立方_数字孪生场景_真实项目.png",alt:"渔立方养殖场数字孪生场景页面，部分业务信息已遮盖",caption:"数字孪生场景的页面与交互原型展示。"},
      {id:"video",group:"twin",title:"监控场景与视频界面",src:"assets/05_渔立方_监控画面_真实项目.png",alt:"渔立方养殖设备监控场景画面",caption:"监控场景界面素材，用于视频墙、全屏和轮巡等交互原型展示。"}
      ,{id:"picture-workbench",group:"picture",title:"AI 修图智能体",src:"assets/ai-picture-editor/workbench.png",alt:"AI 修图智能体本机运行画面，蓝调海报位于画布中，周围是编辑工具、图层与 AI 指令面板",caption:"本机运行中的悬浮画布、图层、选区工具与导出入口。"}
    ];
    const FILTERS=[{id:"all",label:"全部证据"},{id:"workflow",label:"工作流"},{id:"rag",label:"知识检索"},{id:"api",label:"业务 API"}];
    const ENGINEERING_MEDIA=MEDIA.slice(0,6);
    const mediaById=id=>MEDIA.find(item=>item.id===id);

    function MediaButton({id,onOpen,className="",lazy=true}){
      const item=mediaById(id);
      return <button type="button" className={"evidence-trigger "+className} data-evidence-id={id} aria-haspopup="dialog" aria-label={"放大查看"+item.title} onClick={event=>onOpen(id,event.currentTarget)}><img src={item.src} alt={item.alt} loading={lazy?"lazy":"eager"}/><span className="image-zoom" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5M10.5 8v5m-2.5-2.5h5"/></svg></span></button>;
    }

    function Lightbox({items,index,trigger,onClose,onChange}){
      const dialogRef=React.useRef(null),closeRef=React.useRef(null),closeTimer=React.useRef(null);
      const [closing,setClosing]=React.useState(false);
      const item=items[index];
      React.useEffect(()=>{
        const dialog=dialogRef.current,oldOverflow=document.body.style.overflow;
        document.body.style.overflow="hidden";
        if(!dialog.open)dialog.showModal();
        closeRef.current.focus({preventScroll:true});
        return()=>{
          window.clearTimeout(closeTimer.current);
          if(dialog.open)dialog.close();
          document.body.style.overflow=oldOverflow;
          if(trigger&&trigger.isConnected)trigger.focus({preventScroll:true});
        };
      },[trigger]);
      function requestClose(){
        if(closing)return;
        if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){onClose();return;}
        setClosing(true);
        closeTimer.current=window.setTimeout(onClose,180);
      }
      function change(step){if(!closing&&items.length>1)onChange((index+step+items.length)%items.length);}
      function onKeyDown(event){
        if(event.key==="ArrowLeft"){event.preventDefault();change(-1);return;}
        if(event.key==="ArrowRight"){event.preventDefault();change(1);return;}
        if(event.key!=="Tab")return;
        const focusable=Array.from(dialogRef.current.querySelectorAll("button:not([disabled]),a[href]")).filter(node=>node.getClientRects().length>0);
        const first=focusable[0],last=focusable[focusable.length-1];
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
      }
      function onBackdropClick(event){
        if(event.target!==event.currentTarget)return;
        const rect=event.currentTarget.getBoundingClientRect();
        if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)requestClose();
      }
      return <dialog id="lightbox-dialog" ref={dialogRef} className={"viewer"+(closing?" is-closing":"")} aria-modal="true" aria-labelledby="lightbox-title" aria-describedby="lightbox-caption" onCancel={event=>{event.preventDefault();requestClose();}} onClose={onClose} onKeyDown={onKeyDown} onClick={onBackdropClick}>
        <header className="viewer-head"><h2 id="lightbox-title">{item.title}</h2><button type="button" className="viewer-close" ref={closeRef} onClick={requestClose} aria-label="关闭图片查看器">×</button></header>
        <div className="viewer-media"><img key={item.id} src={item.src} alt={item.alt}/></div>
        <p className="viewer-caption" id="lightbox-caption">{item.caption}</p>
        <div className={"viewer-controls"+(items.length===1?" single":"")}>
          {items.length>1&&<><div className="viewer-step"><button type="button" className="button" onClick={()=>change(-1)} aria-label="查看上一张图片">← 上一张</button><button type="button" className="button" onClick={()=>change(1)} aria-label="查看下一张图片">下一张 →</button></div><output aria-live="polite" aria-label="当前图片编号">{index+1} / {items.length}</output></>}
          <a className="viewer-original" href={item.src} target="_blank" rel="noopener noreferrer">查看原图 ↗</a>
        </div>
      </dialog>;
    }

    function App(){
      const [filter,setFilter]=React.useState("all"),[lightbox,setLightbox]=React.useState(null);
      const visibleMedia=filter==="all"?ENGINEERING_MEDIA:ENGINEERING_MEDIA.filter(item=>item.group===filter);
      function openMedia(id,trigger){
        const item=mediaById(id);
        const items=ENGINEERING_MEDIA.some(media=>media.id===id)?visibleMedia:MEDIA.filter(media=>media.group===item.group);
        setLightbox({items,index:items.findIndex(media=>media.id===id),trigger});
      }
      return <>
        <div id="page-shell">
          <header className="header">
            <nav className="wrap navigation" aria-label="主导航">
              <a className="brand" href="#profile"><span className="brand-mark">LYT</span><span>雷雨天</span></a>
              <div className="nav-links"><a href="#catalog">作品</a><a className="desktop-nav" href="#evidence">项目证据</a><a href="#skills">技术实践</a><a href="#contact">联系</a></div>
            </nav>
          </header>
          <main className="wrap">
            <section className="identity" id="profile" aria-labelledby="role">
              <div><p className="eyebrow">2027 届校招</p><h1 id="role">AI 应用开发工程师</h1></div>
              <p className="meta">武汉轻工大学 · 软件工程</p>
            </section>
            <div className="catalog" id="catalog">
              <nav className="project-nav" aria-label="项目目录">
                <a href="#picture-editor">AI 修图工作台</a><a href="#evidence">智慧水产 AI 助手</a><a href="#web-detail">Web 交互原型</a><a href="#twin-detail">数据可视化</a>
              </nav>
              <article className="featured" id="picture-editor" aria-labelledby="picture-title">
                <div className="picture-copy">
                  <p className="label">个人项目 · 已开源</p>
                  <h2 id="picture-title">AI 修图智能体</h2>
                  <p className="case-intro"><span className="keep">自然语言规划修图，</span><span className="keep">画布编辑、预览与导出。</span></p>
                  <p className="picture-role">我参与需求取舍、模型选择、界面反馈与功能验收，<span className="keep">通过 AI 协作推进实现。</span></p>
                  <div className="actions picture-links">
                    <a className="button primary" href="https://github.com/nigu666/ai-picture-editor" target="_blank" rel="noopener noreferrer">查看项目 <span aria-hidden="true">↗</span></a>
                    <a className="button" href="https://github.com/nigu666/ai-picture-editor/releases/latest" target="_blank" rel="noopener noreferrer" aria-describedby="picture-install-note">下载体验 <span aria-hidden="true">↗</span></a>
                  </div>
                  <p className="picture-install-note" id="picture-install-note">Windows x64 · 需 Docker Desktop</p>
                </div>
                <figure className="picture-preview"><MediaButton id="picture-workbench" onOpen={openMedia} lazy={false}/></figure>
              </article>
            </div>

            <section className="project-process" id="picture-process" aria-labelledby="picture-process-title">
              <h2 id="picture-process-title">编辑、规划与交付</h2>
              <ol className="build-path">
                <li><h3>画布与图层</h3><p>素材上传、会话保存、裁剪调色与多图层编辑，支持历史回退和图片导出。</p></li>
                <li><h3>规划与执行</h3><p>LangGraph 组织规划与校验，Pydantic 约束工具参数；确认计划后，由 Worker 处理任务并返回进度。</p></li>
                <li><h3>本机交付</h3><p>连接接口、数据库、队列与图片存储，通过 Docker Compose 提供中文安装入口。</p></li>
              </ol>
              <div className="picture-proof"><a className="text-link" href="https://github.com/nigu666/ai-picture-editor/releases/tag/v0.1.0" target="_blank" rel="noopener noreferrer">版本说明 · v0.1.0 ↗</a></div>
              <details className="project-notes"><summary>安装与使用说明</summary><div><p>注册登录、图片读写、导出与重启保留数据已完成本机验收。云端 AI 需自行配置百炼密钥、网络和模型权限，调用可能产生费用；当前提供本机使用版本。</p><p>学习参考编程导航 AI 修图智能体教程；本项目自行实现部分采用 MIT 许可，第三方框架、服务与模型保留各自授权。</p></div></details>
            </section>

            <section className="section" id="evidence" aria-labelledby="evidence-title">
              <header className="section-head"><p className="label">实习实践</p><h2 id="evidence-title">智慧水产 AI 助手</h2><p className="lead">通过 Dify 工作流，连接养殖知识问答、设备查询与已有业务接口。</p></header>
              <div className="case-facts">
                <article><h3>我的工作</h3><p>整理养殖资料，配置 RAG 检索、提示词与工作流；提取查询参数，映射设备 ID，处理接口返回与异常分支。</p></article>

              </div>

              <div className="evidence-grid" key={filter}>{visibleMedia.map(item=><article className="evidence-item" key={item.id}><MediaButton id={item.id} onOpen={openMedia}/><h3>{item.title}</h3><p>{item.caption}</p></article>)}</div>
              <section className="mobile-section" aria-labelledby="mobile-title">
                <div className="mobile-copy"><h3 id="mobile-title">移动端 AI 入口</h3><p>完成 AI 入口、对话面板、消息状态与接口异常反馈，参与现有 Vue2 页面的迁移适配和接口联调。</p><p>移动端为交互原型，在线服务不可用时会显示异常提示。</p><div className="actions"><a className="button" href="../zhihui-shuichan-jiaohu-yuanxing/智慧水产设备管理助手/" target="_blank" rel="noopener noreferrer">打开移动端原型 ↗</a></div></div>

            <section className="section" id="web-detail" aria-labelledby="web-title">
              <header className="section-head"><p className="label">业务与交互</p><h2 id="web-title">智慧增殖放流站 Web 原型</h2><p className="lead">围绕设备、生产与报修业务，将需求整理为可操作的页面和流程。</p></header>
              <div className="scope-grid">
                <article><h3>负责内容</h3><ul className="scope-list"><li>参与需求沟通，梳理业务字段与页面关系</li><li>综合看板及设备、生产模块的交互原型</li><li>筛选、分页、抽屉、表单与页面状态联动</li></ul></article>
                <article><h3>联动问题处理</h3><p>针对维修工单与经验库记录不一致的问题，统一业务 ID，补充状态判断和提交校验，让维修记录、经验提交与审核结果能够对应。</p></article>
              </div>
              <div className="web-chain"><strong>异常处理流程</strong><p className="flow"><span>巡检异常</span><b aria-hidden="true">→</b><span>报修</span><b aria-hidden="true">→</b><span>维修工单</span></p></div>
              <div className="actions"><a className="button primary" href="../zhihui-shuichan-jiaohu-yuanxing/智慧增殖站综合看板/" target="_blank" rel="noopener noreferrer">打开 Web 原型 ↗</a><a className="button" href="https://github.com/nigu666/zhihui-shuichan-jiaohu-yuanxing" target="_blank" rel="noopener noreferrer">原型仓库 ↗</a></div>
            </section>

            <section className="section" id="twin-detail" aria-labelledby="twin-title">
              <header className="section-head"><p className="label">数据可视化</p><h2 id="twin-title">养殖监控与数字孪生原型</h2><p className="lead">负责界面布局、图表交互、视频墙与场景切换，组织水质、设备、告警和监控信息。</p></header>
              <div className="twin-visuals"><figure className="twin-main"><MediaButton id="dashboard" onOpen={openMedia}/></figure><div className="twin-support"><MediaButton id="twin-scene" onOpen={openMedia}/><MediaButton id="video" onOpen={openMedia}/></div></div>
              <div className="actions"><a className="button primary" href="../zhihui-shuichan-jiaohu-yuanxing/渔立方数据驾驶舱/" target="_blank" rel="noopener noreferrer">打开数据驾驶舱 ↗</a><a className="button" href="../zhihui-shuichan-jiaohu-yuanxing/渔立方数字孪生养殖系统/" target="_blank" rel="noopener noreferrer">打开监控原型 ↗</a></div>
            </section>

            <section className="section expertise" id="skills" aria-labelledby="skills-title">
              <header className="section-head"><h2 id="skills-title">技术与实践</h2></header>
              <div className="skills">
                <article className="skill-group"><h3>Python 与后端</h3><p>FastAPI 接口与 Pydantic 校验；<span className="keep">SQLAlchemy / Alembic</span> 数据管理，<span className="keep">PostgreSQL 存储。</span></p></article>
                <article className="skill-group"><h3>Agent 与 RAG</h3><p>Dify 知识检索与业务工作流；LangGraph <span className="keep">规划、工具调用</span>，<span className="keep">结构化输出与人工确认。</span></p></article>
                <article className="skill-group"><h3>前端与工程</h3><p>React、TypeScript 与 Konva 画布；JavaScript、HTML/CSS、SVG 交互原型，以及 Git 与 Docker Compose。</p></article>
              </div>
            </section>

            <section className="contact" id="contact" aria-labelledby="contact-title">
              <h2 id="contact-title">联系我</h2>
              <div className="actions"><a className="button primary" title="打开默认邮件应用" aria-label="通过默认邮件应用联系雷雨天" href="mailto:3077602965@qq.com?subject=AI%E5%BA%94%E7%94%A8%E5%B7%A5%E7%A8%8B%E5%B8%88%E4%BD%9C%E5%93%81%E9%9B%86%E8%81%94%E7%B3%BB">3077602965@qq.com</a><a className="button" href="https://github.com/nigu666" target="_blank" rel="noopener noreferrer">GitHub 主页 ↗</a><a className="text-link" href="../zhihui-shuichan-jiaohu-yuanxing/">更多交互作品 ↗</a></div>
            </section>
            <footer className="footer"><a href="#profile">返回顶部 ↑</a></footer>
          </main>
        </div>
        {lightbox&&<Lightbox items={lightbox.items} index={lightbox.index} trigger={lightbox.trigger} onClose={()=>setLightbox(null)} onChange={index=>setLightbox(current=>({...current,index}))}/>}
      </>;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
